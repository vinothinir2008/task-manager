<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<style>
:root{--bg:#eef2f1;--ink:#17212b;--muted:#5d6b76;--card:#fff;--accent:#0f766e;--warn:#c2410c;--line:#d5dedb}
@media(prefers-color-scheme:dark){:root{--bg:#10171c;--ink:#e8eef0;--muted:#97a6ad;--card:#18222a;--accent:#2dd4bf;--warn:#fb923c;--line:#2b3943}}
*{box-sizing:border-box;margin:0}body{font:16px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:20px}
[hidden]{display:none!important}main{max-width:960px;margin:0 auto}
h1{font-size:1.6rem}h2{font-size:1.1rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.btn{padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:#04201d;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:.85rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#auth{max-width:380px;margin:8vh auto}#auth .card{display:grid;gap:4px}
#err,#aerr{color:var(--warn);min-height:1.4em;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.filters .btn.on{background:var(--accent);color:#04201d;border-color:var(--accent)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.task{display:grid;gap:8px;border-left:5px solid var(--line)}
.task.high{border-left-color:var(--warn)}.task.medium{border-left-color:var(--accent)}
.task.done h3{text-decoration:line-through;color:var(--muted)}
.meta{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}.late{color:var(--warn);font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row select{width:auto}
@media(max-width:700px){.grid2{grid-template-columns:1fr 1fr}.grid2 label:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<main>
<section id="auth" hidden>
  <form class="card" id="authForm">
    <h1>Task Manager</h1>
    <p style="color:var(--muted);margin-bottom:10px" id="authSub">Log in to see your tasks.</p>
    <label id="nameBox" hidden>Name<input id="name" maxlength="60" autocomplete="name"></label>
    <label>Email<input id="email" type="email" autocomplete="email" required></label>
    <label>Password<input id="password" type="password" minlength="6" autocomplete="current-password" required></label>
    <p id="aerr" role="alert"></p>
    <button class="btn" id="authBtn">Log in</button>
    <button class="btn ghost" type="button" id="switch">Create an account</button>
  </form>
</section>

<section id="app" hidden>
  <header><h1 id="hello">My tasks</h1><button class="btn ghost sm" id="logout">Log out</button></header>
  <form class="card" id="taskForm">
    <h2 id="formTitle">Add a task</h2>
    <div class="grid2">
      <label>Title<input id="title" maxlength="120" required></label>
      <label>Priority<select id="priority"><option>low</option><option selected>medium</option><option>high</option></select></label>
      <label>Status<select id="status"><option value="todo">To do</option><option value="in-progress">In progress</option><option value="done">Done</option></select></label>
      <label>Due date<input id="due" type="date"></label>
    </div>
    <label>Description<textarea id="desc" rows="2" maxlength="500"></textarea></label>
    <p id="err" role="alert"></p>
    <button class="btn" id="saveBtn">Add task</button>
    <button class="btn ghost" type="button" id="cancel" hidden>Cancel edit</button>
  </form>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem('tm_token'), tasks = [], filter = 'all', editId = null, register = false;
const labels = { todo: 'To do', 'in-progress': 'In progress', done: 'Done' };

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, {
    method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && token) logout();
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
function logout() { token = null; localStorage.removeItem('tm_token'); tasks = []; show(); }
function show() {
  $('#auth').hidden = !!token; $('#app').hidden = !token;
  if (token) { $('#hello').textContent = (localStorage.getItem('tm_name') || 'My') + '\u2019s tasks'; load(); }
}
function mode() {
  $('#nameBox').hidden = !register; $('#name').required = register;
  $('#authBtn').textContent = register ? 'Create account' : 'Log in';
  $('#switch').textContent = register ? 'I already have an account' : 'Create an account';
  $('#authSub').textContent = register ? 'Create an account to start.' : 'Log in to see your tasks.';
  $('#aerr').textContent = '';
}
$('#switch').onclick = () => { register = !register; mode(); };
$('#authForm').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const d = await api(register ? '/register' : '/login', 'POST',
      { name: $('#name').value, email: $('#email').value, password: $('#password').value });
    token = d.token; localStorage.setItem('tm_token', token); localStorage.setItem('tm_name', d.name);
    $('#password').value = ''; show();
  } catch (err) { $('#aerr').textContent = err.message; }
};
$('#logout').onclick = logout;

async function load() { try { tasks = await api('/tasks'); render(); } catch (e) { $('#err').textContent = e.message; } }
function resetForm() { editId = null; $('#taskForm').reset(); $('#formTitle').textContent = 'Add a task'; $('#saveBtn').textContent = 'Add task'; $('#cancel').hidden = true; }
$('#cancel').onclick = resetForm;
$('#taskForm').onsubmit = async (e) => {
  e.preventDefault(); $('#err').textContent = '';
  const body = { title: $('#title').value, description: $('#desc').value, status: $('#status').value, priority: $('#priority').value, dueDate: $('#due').value };
  try { await api(editId ? '/tasks/' + editId : '/tasks', editId ? 'PUT' : 'POST', body); resetForm(); load(); }
  catch (err) { $('#err').textContent = err.message; }
};
function render() {
  const f = $('#filters'); f.innerHTML = '';
  ['all', 'todo', 'in-progress', 'done'].forEach((k) => {
    const n = k === 'all' ? tasks.length : tasks.filter((t) => t.status === k).length;
    const b = document.createElement('button');
    b.className = 'btn ghost sm' + (filter === k ? ' on' : ''); b.textContent = (k === 'all' ? 'All' : labels[k]) + ' (' + n + ')';
    b.onclick = () => { filter = k; render(); }; f.appendChild(b);
  });
  const list = $('#list'); list.innerHTML = '';
  const shown = tasks.filter((t) => filter === 'all' || t.status === filter);
  if (!shown.length) { list.innerHTML = '<p style="color:var(--muted)">No tasks here yet. Add one above.</p>'; return; }
  shown.forEach((t) => {
    const el = document.createElement('article'); el.className = 'card task ' + t.priority + (t.status === 'done' ? ' done' : '');
    const h = document.createElement('h3'); h.textContent = t.title; el.appendChild(h);
    if (t.description) { const p = document.createElement('p'); p.textContent = t.description; el.appendChild(p); }
    const m = document.createElement('div'); m.className = 'meta';
    const due = t.dueDate ? new Date(t.dueDate) : null;
    const late = due && t.status !== 'done' && due < new Date(new Date().toDateString());
    m.innerHTML = '<span>' + t.priority + ' priority</span>' + (due ? '<span class="' + (late ? 'late' : '') + '">' + (late ? 'Overdue: ' : 'Due ') + due.toLocaleDateString() + '</span>' : '');
    el.appendChild(m);
    const row = document.createElement('div'); row.className = 'row';
    const sel = document.createElement('select'); sel.setAttribute('aria-label', 'Status');
    Object.keys(labels).forEach((k) => { const o = new Option(labels[k], k, false, k === t.status); sel.add(o); });
    sel.onchange = async () => { try { await api('/tasks/' + t._id, 'PUT', { ...t, status: sel.value }); load(); } catch (e) { $('#err').textContent = e.message; } };
    const ed = document.createElement('button'); ed.className = 'btn ghost sm'; ed.textContent = 'Edit';
    ed.onclick = () => {
      editId = t._id; $('#title').value = t.title; $('#desc').value = t.description || ''; $('#status').value = t.status;
      $('#priority').value = t.priority; $('#due').value = t.dueDate ? t.dueDate.slice(0, 10) : '';
      $('#formTitle').textContent = 'Edit task'; $('#saveBtn').textContent = 'Save changes'; $('#cancel').hidden = false; scrollTo({ top: 0, behavior: 'smooth' });
    };
    const del = document.createElement('button'); del.className = 'btn ghost sm'; del.textContent = 'Delete';
    del.onclick = async () => { if (confirm('Delete this task?')) { await api('/tasks/' + t._id, 'DELETE'); load(); } };
    row.append(sel, ed, del); el.appendChild(row); list.appendChild(el);
  });
}
mode(); show();
</script>
</body>
</html>
